<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>五目並べ</title>
    <style>
        :root {
            --board-color: #dbb368;
            --wash-bg: #1a202c;
            --text-gold: #d4af37;
        }
        body { 
            background: radial-gradient(circle, #2d3748 0%, #1a202c 100%);
            color: #fff; 
            font-family: "Hiragino Mincho ProN", "serif"; 
            display: flex; flex-direction: column; align-items: center; margin: 0; padding: 20px;
            overflow: hidden;
        }
        
        /* 形勢判断ゲージ */
        .status-container { width: 100%; max-width: 650px; margin-bottom: 20px; z-index: 10; }
        .gauge-label { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 8px; font-weight: bold; color: var(--text-gold); }
        .gauge-bg { height: 8px; background: rgba(0,0,0,0.5); border-radius: 4px; overflow: hidden; border: 1px solid #444; }
        #gauge-bar { height: 100%; width: 50%; background: linear-gradient(90deg, #e53e3e, #718096, #3182ce); transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1); }

        #main-layout { display: flex; gap: 40px; align-items: flex-start; z-index: 10; }

        /* 碁盤のデザイン */
        #board-container { 
            padding: 15px; 
            background-color: var(--board-color); 
            background-image: url('https://www.transparenttextures.com/patterns/wood-pattern.png'); /* 木目 */
            border: 3px solid #5d4037; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.7);
            position: relative;
        }
        #board { display: grid; border: 0.5px solid rgba(0,0,0,0.3); }
        .cell { 
            width: 38px; height: 38px; border: 0.5px solid rgba(0,0,0,0.3); 
            box-sizing: border-box; display: flex; align-items: center; justify-content: center; 
            cursor: pointer; position: relative;
        }
        
        /* 星（黒ポッチ） */
        .hoshi::after {
            content: ""; width: 8px; height: 8px; background: #000; border-radius: 50%;
            position: absolute; z-index: 1; pointer-events: none;
        }

        .stone { width: 34px; height: 34px; border-radius: 50%; z-index: 2; box-shadow: 2px 4px 6px rgba(0,0,0,0.5); pointer-events: none; }
        .stone.new { animation: drop-stone 0.2s ease-out; }
        @keyframes drop-stone { from { transform: translateY(-10px) scale(1.1); opacity: 0; } to { transform: translateY(0) scale(1); opacity: 1; } }
        .black { background: radial-gradient(circle at 30% 30%, #444, #000); }
        .white { background: radial-gradient(circle at 30% 30%, #fff, #bbb); border: 1px solid #999; }

        /* パネル */
        .panel { width: 320px; display: flex; flex-direction: column; gap: 15px; }
        .info-box { background: rgba(0,0,0,0.4); border: 1px solid var(--text-gold); padding: 12px; font-size: 18px; text-align: center; color: var(--text-gold); }
        .log-box { 
            background: rgba(0,0,0,0.6); height: 350px; padding: 15px; font-size: 13px; border-radius: 4px; border: 1px solid #444;
            display: flex; flex-direction: column-reverse; line-height: 1.8; overflow-y: auto;
        }
        
        button, select { 
            padding: 10px; font-family: serif; font-size: 14px; border-radius: 2px; border: 1px solid #666; cursor: pointer; background: #333; color: #eee;
        }
        button:hover { background: #444; border-color: var(--text-gold); }
        button.primary { background: #822727; border-color: #a52a2a; }

        /* ふすまアニメーション */
        #fusuma-l, #fusuma-r {
            position: fixed; top: 0; width: 50%; height: 100%; 
            background: #e2e2e2; background-image: url('https://www.transparenttextures.com/patterns/shippo.png');
            border: 15px solid #222; z-index: 1000; transition: transform 0.8s ease-in-out;
            display: flex; align-items: center; justify-content: center;
        }
        #fusuma-l { left: -50%; transform: translateX(0); border-right: 5px solid #444; }
        #fusuma-r { right: -50%; transform: translateX(0); border-left: 5px solid #444; }
        .fusuma-handle { width: 40px; height: 100px; background: #111; border-radius: 5px; border: 1px solid #d4af37; }
        
        .fusuma-active #fusuma-l { transform: translateX(100%); }
        .fusuma-active #fusuma-r { transform: translateX(-100%); }

        #victory-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 500; }
    </style>
</head>
<body id="body-tag">

    <h1 style="color:var(--text-gold); letter-spacing: 10px; margin-top: 0;">五目並べ</h1>

    <div class="status-container">
        <div class="gauge-label">
            <span>貴殿 (黒)</span>
            <span id="judge-text">形勢均衡</span>
            <span>機巧 (白)</span>
        </div>
        <div class="gauge-bg"><div id="gauge-bar"></div></div>
    </div>

    <div id="main-layout">
        <div>
            <div id="board-container"><div id="board"></div></div>
            <div style="margin-top: 20px; display: flex; gap: 10px;">
                <button onclick="undoMove()">一手戻す</button>
                <button class="hint-btn" onclick="showHint()">助言を得る</button>
                <button onclick="triggerFusuma()" class="primary">新しく対局</button>
            </div>
        </div>

        <div class="panel">
            <div class="info-box" id="status-text">いざ、参る。</div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <select id="board-size" onchange="resetGame()">
                    <option value="9">九路盤</option>
                    <option value="15" selected>十五路盤</option>
                    <option value="19">十九路盤</option>
                </select>
                <select id="ai-level">
                    <option value="ume">難度：梅</option>
                    <option value="take" selected>難度：竹</option>
                    <option value="matsu">難度：松</option>
                </select>
            </div>
            <select id="game-mode" onchange="resetGame()">
                <option value="cpu">対機巧 (CPU)</option>
                <option value="pvp">二人対局</option>
            </select>
            <div class="log-box" id="log-window"></div>
        </div>
    </div>

    <div id="fusuma-l"><div class="fusuma-handle"></div></div>
    <div id="fusuma-r"><div class="fusuma-handle"></div></div>
    <canvas id="victory-canvas"></canvas>

<script>
let SIZE = 15;
let board = [];
let history = [];
let gameOver = false;
let isThinking = false;

function createBoard() {
    SIZE = parseInt(document.getElementById('board-size').value);
    board = Array(SIZE).fill().map(() => Array(SIZE).fill(0));
    const boardEl = document.getElementById('board');
    boardEl.style.gridTemplateColumns = `repeat(${SIZE}, 38px)`;
    boardEl.style.gridTemplateRows = `repeat(${SIZE}, 38px)`;
    boardEl.innerHTML = '';
    
    // 星（ドット）の位置定義
    const hoshiPos = getHoshiPositions(SIZE);

    for(let r=0; r<SIZE; r++) {
        for(let c=0; c<SIZE; c++) {
            const cell = document.createElement('div');
            cell.className = 'cell';
            if(hoshiPos.includes(`${r},${c}`)) cell.classList.add('hoshi');
            cell.id = `cell-${r}-${c}`;
            cell.onclick = () => handleInput(r, c);
            boardEl.appendChild(cell);
        }
    }
}

function getHoshiPositions(size) {
    if(size === 9) return ["2,2", "2,6", "4,4", "6,2", "6,6"];
    if(size === 15) return ["3,3", "3,11", "7,7", "11,3", "11,11"];
    if(size === 19) return ["3,3", "3,9", "3,15", "9,3", "9,9", "9,15", "15,3", "15,9", "15,15"];
    return [];
}

function handleInput(r, c) {
    if(board[r][c] !== 0 || gameOver || isThinking) return;
    const player = (history.length % 2 === 0) ? 1 : 2;
    processMove(r, c, player);

    if(!gameOver && document.getElementById('game-mode').value === "cpu") {
        isThinking = true;
        document.getElementById('status-text').innerText = "機巧 思案中...";
        setTimeout(() => {
            const move = searchBestMove(document.getElementById('ai-level').value, 2);
            processMove(move.r, move.c, 2);
            isThinking = false;
        }, 600);
    }
}

function processMove(r, c, p) {
    const eval = analyzeMove(r, c, p);
    board[r][c] = p;
    history.push({r, c, p});
    
    const cell = document.getElementById(`cell-${r}-${c}`);
    const stone = document.createElement('div');
    stone.className = `stone ${p === 1 ? 'black' : 'white'} new`;
    cell.appendChild(stone);

    addLog(`【${p===1?'貴殿':'機巧'}】(${r+1},${c+1}) ${eval.comment}`, eval.color);

    if(checkWin(r, c, p)) {
        gameOver = true;
        document.getElementById('status-text').innerText = (p === 1 ? "貴殿" : "機巧") + "の勝ちにございます。";
        startConfetti();
    } else {
        document.getElementById('status-text').innerText = (history.length%2===0?"黒":"白") + "の番です";
        updateGauge(r, c, p);
    }
}

function analyzeMove(r, c, p) {
    const att = evaluate(r, c, p);
    const def = evaluate(r, c, p === 1 ? 2 : 1);
    
    if(att >= 100000) return { comment: "――これにて終局。", color: "#fbd38d" };
    if(def >= 10000) return { comment: "。絶体絶命を凌ぐ。", color: "#fc8181" };
    if(att >= 10000) return { comment: "。勝利に王手。", color: "#f6e05e" };
    if(att >= 3000) return { comment: "。鋭き攻め。", color: "#63b3ed" };
    if(def >= 3000) return { comment: "。手堅い受け。", color: "#9ae6b4" };
    
    const randomMsgs = ["。静かな一手。", "。様子を見る。", "。布石を打つ。", "。盤面を整える。"];
    return { comment: randomMsgs[Math.floor(Math.random()*randomMsgs.length)], color: "#ccc" };
}

function searchBestMove(level, player) {
    let best = {r: -1, c: -1, score: -Infinity};
    const opponent = player === 1 ? 2 : 1;
    const weights = { ume: 0.7, take: 1.5, matsu: 3.0 };
    const defWeight = weights[level];

    for(let r=0; r<SIZE; r++) {
        for(let c=0; c<SIZE; c++) {
            if(board[r][c] !== 0) continue;
            let score = evaluate(r, c, player) + (evaluate(r, c, opponent) * defWeight);
            score += (SIZE - Math.abs(SIZE/2 - r) - Math.abs(SIZE/2 - c));
            if(level === 'ume') score += Math.random() * 300;
            if(score > best.score) best = {r, c, score};
        }
    }
    return best;
}

function evaluate(r, c, p) {
    let total = 0;
    [[1,0],[0,1],[1,1],[1,-1]].forEach(([dr, dc]) => {
        let count = 1, open = 0;
        [1, -1].forEach(s => {
            let nr = r+dr*s, nc = c+dc*s;
            while(nr>=0 && nr<SIZE && nc>=0 && nc<SIZE && board[nr][nc] === p) { count++; nr+=dr*s; nc+=dc*s; }
            if(nr>=0 && nr<SIZE && nc>=0 && nc<SIZE && board[nr][nc] === 0) open++;
        });
        if(count >= 5) total += 100000;
        else if(count === 4) total += (open === 2) ? 10000 : 2000;
        else if(count === 3) total += (open === 2) ? 1500 : 200;
    });
    return total;
}

function checkWin(r, c, p) {
    return [[1,0],[0,1],[1,1],[1,-1]].some(([dr, dc]) => {
        let ct = 1;
        [1, -1].forEach(s => {
            let nr = r+dr*s, nc = c+dc*s;
            while(nr>=0 && nr<SIZE && nc>=0 && nc<SIZE && board[nr][nc] === p) { ct++; nr+=dr*s; nc+=dc*s; }
        });
        return ct >= 5;
    });
}

function triggerFusuma() {
    const body = document.getElementById('body-tag');
    body.classList.add('fusuma-active');
    setTimeout(() => {
        resetGame();
        setTimeout(() => body.classList.remove('fusuma-active'), 400);
    }, 800);
}

function resetGame() {
    gameOver = false; isThinking = false; history = [];
    document.getElementById('log-window').innerHTML = '';
    document.getElementById('gauge-bar').style.width = "50%";
    const canvas = document.getElementById('victory-canvas');
    canvas.getContext('2d').clearRect(0,0,canvas.width,canvas.height);
    createBoard();
    document.getElementById('status-text').innerText = "いざ、参る。";
}

function undoMove() {
    if(history.length === 0 || gameOver) return;
    const mode = document.getElementById('game-mode').value;
    const steps = (mode === "cpu" && history.length >= 2) ? 2 : 1;
    for(let i=0; i<steps; i++) {
        const last = history.pop();
        if(last) {
            board[last.r][last.c] = 0;
            document.getElementById(`cell-${last.r}-${last.c}`).innerHTML = '';
        }
    }
    document.getElementById('status-text').innerText = (history.length % 2 === 0 ? "黒" : "白") + "の番です";
}

function showHint() {
    if(gameOver || isThinking) return;
    const p = (history.length % 2 === 0) ? 1 : 2;
    const move = searchBestMove('matsu', p);
    const cell = document.getElementById(`cell-${move.r}-${move.c}`);
    const h = document.createElement('div'); h.className = 'hint';
    cell.appendChild(h);
    setTimeout(() => h.remove(), 2000);
}

function addLog(msg, color) {
    const win = document.getElementById('log-window');
    const div = document.createElement('div');
    div.style.color = color; div.innerText = msg;
    win.prepend(div);
}

function updateGauge(r, c, p) {
    const val = evaluate(r, c, p);
    let rate = 50 + (p === 2 ? val/800 : -val/800);
    rate = Math.max(10, Math.min(90, rate));
    document.getElementById('gauge-bar').style.width = rate + "%";
}

function startConfetti() {
    const canvas = document.getElementById('victory-canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    let particles = Array.from({length: 100}, () => ({
        x: Math.random() * canvas.width, y: -20,
        w: Math.random() * 8 + 4, h: Math.random() * 10 + 5,
        color: `hsl(${Math.random() * 40 + 35}, 100%, 60%)`, // 金・銅
        v: Math.random() * 4 + 2, r: Math.random() * 360
    }));
    function frame() {
        if(!gameOver) return;
        ctx.clearRect(0,0,canvas.width,canvas.height);
        particles.forEach(p => {
            ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r * Math.PI / 180);
            ctx.fillStyle = p.color; ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h); ctx.restore();
            p.y += p.v; p.r += 3; if(p.y > canvas.height) p.y = -20;
        });
        requestAnimationFrame(frame);
    }
    frame();
}

createBoard();
</script>
</body>
</html>
