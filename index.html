<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>五目並べ 極 - 松竹梅AI</title>
    <style>
        :root { --wood: #dcb35c; --line: #333; --bg: #2c3e50; --panel: #34495e; --log-bg: #1a252f; }
        body { background-color: var(--bg); color: white; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        #main-container { display: flex; gap: 30px; padding: 25px; background: var(--panel); border-radius: 15px; box-shadow: 0 20px 50px rgba(0,0,0,0.6); flex-wrap: wrap; }
        
        /* 盤面 */
        #board { display: grid; grid-template-columns: repeat(15, 34px); grid-template-rows: repeat(15, 34px); background-color: var(--wood); padding: 10px; border: 5px solid #8b4513; }
        .cell { width: 34px; height: 34px; border: 0.5px solid rgba(0,0,0,0.1); display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .stone { width: 30px; height: 30px; border-radius: 50%; z-index: 2; box-shadow: 2px 3px 5px rgba(0,0,0,0.4); }
        .black { background: radial-gradient(circle at 30% 30%, #555, #000); }
        .white { background: radial-gradient(circle at 30% 30%, #fff, #bbb); border: 1px solid #aaa; }

        /* 勝率ゲージ */
        #win-rate-container { width: 100%; height: 30px; background: #555; border-radius: 15px; margin-bottom: 20px; overflow: hidden; position: relative; border: 2px solid #fff; }
        #win-rate-bar { height: 100%; width: 50%; background: linear-gradient(to right, #e74c3c, #3498db); transition: width 0.8s ease-in-out; }
        #win-rate-text { position: absolute; width: 100%; text-align: center; line-height: 30px; font-weight: bold; text-shadow: 1px 1px 2px #000; }

        /* サイドパネル */
        #side-panel { width: 320px; display: flex; flex-direction: column; gap: 15px; }
        #log-window { flex-grow: 1; background: var(--log-bg); border-radius: 8px; padding: 15px; font-size: 0.85em; overflow-y: auto; height: 350px; border: 1px solid #555; color: #ecf0f1; display: flex; flex-direction: column-reverse; }
        .log-entry { margin-bottom: 8px; padding-bottom: 5px; border-bottom: 1px solid #2c3e50; }
        
        select, button { padding: 10px; border-radius: 5px; border: none; font-weight: bold; cursor: pointer; }
        .controls { display: flex; gap: 10px; margin-bottom: 10px; }
    </style>
</head>
<body>

    <h1>五目並べ 極</h1>

    <div style="width: 100%; max-width: 800px;">
        <div style="display: flex; justify-content: space-between; margin-bottom: 5px; font-size: 0.9em;">
            <span>あなた (黒)</span>
            <span>AI (白)</span>
        </div>
        <div id="win-rate-container">
            <div id="win-rate-bar"></div>
            <div id="win-rate-text">勝率分析中...</div>
        </div>
    </div>

    <div id="main-container">
        <div>
            <div class="controls">
                <select id="level-select">
                    <option value="ume">難易度：梅 (初心者)</option>
                    <option value="take" selected>難易度：竹 (中級者)</option>
                    <option value="matsu">難易度：松 (上級者)</option>
                </select>
                <button onclick="resetGame()" style="background: #e67e22; color: white;">リセット</button>
            </div>
            <div id="board"></div>
        </div>

        <div id="side-panel">
            <div id="status-display" style="font-size: 1.2em; text-align: center; padding: 10px; background: rgba(0,0,0,0.2); border-radius: 5px;">あなたの番です</div>
            <div id="log-window"></div>
        </div>
    </div>

<script>
const size = 15;
let board = Array(size).fill().map(() => Array(size).fill(0));
let gameOver = false;
let isAiThinking = false;

function initBoard() {
    const boardEl = document.getElementById('board');
    boardEl.innerHTML = '';
    for(let r=0; r<size; r++) {
        for(let c=0; c<size; c++) {
            const cell = document.createElement('div');
            cell.className = 'cell';
            cell.onclick = () => playerMove(r, c);
            boardEl.appendChild(cell);
        }
    }
    updateWinRate(0, 0);
    addLog("対局開始。難易度を選んで打ってください。");
}

function addLog(msg, isAi = false) {
    const logWin = document.getElementById('log-window');
    const div = document.createElement('div');
    div.className = 'log-entry';
    div.innerHTML = `<span style="color:${isAi ? '#3498db':'#e74c3c'}; font-weight:bold;">${isAi?'AI':'あなた'}:</span> ${msg}`;
    logWin.prepend(div);
}

function updateWinRate(pScore, aiScore) {
    const total = pScore + aiScore;
    let rate = 50;
    if (total > 0) {
        // スコアに基づいた勝率計算（極端な差が出すぎないよう調整）
        rate = 50 + (aiScore - pScore) / 200;
        rate = Math.max(5, Math.min(95, rate));
    }
    document.getElementById('win-rate-bar').style.width = rate + "%";
    document.getElementById('win-rate-text').innerText = `AI優勢度: ${rate.toFixed(1)}%`;
}

function playerMove(r, c) {
    if(board[r][c] !== 0 || gameOver || isAiThinking) return;
    
    const pEval = evaluateMove(r, c, 1);
    addLog(`(${r+1},${c+1}) に着手。${pEval > 1000 ? '鋭い手です！' : ''}`);
    
    makeMove(r, c, 1);
    if(!gameOver) {
        isAiThinking = true;
        document.getElementById('status-display').innerText = "AI思考中...";
        setTimeout(aiRoutine, 600);
    }
}

function makeMove(r, c, player) {
    board[r][c] = player;
    const cells = document.getElementsByClassName('cell');
    const stone = document.createElement('div');
    stone.className = `stone ${player === 1 ? 'black' : 'white'}`;
    cells[r * size + c].appendChild(stone);

    if(checkWin(r, c, player)) {
        document.getElementById('status-display').innerText = (player === 1 ? "あなたの勝利！" : "AIの勝利...");
        gameOver = true;
    }
}

function aiRoutine() {
    const level = document.getElementById('level-select').value;
    const bestMove = getBestMove(level);
    
    updateWinRate(bestMove.defense, bestMove.attack);
    addLog(bestMove.reason, true);
    makeMove(bestMove.r, bestMove.c, 2);
    
    if(!gameOver) {
        isAiThinking = false;
        document.getElementById('status-display').innerText = "あなたの番です";
    }
}

function getBestMove(level) {
    let bestScore = -Infinity;
    let candidates = [];
    
    // 難易度による重み付け
    const weights = { ume: 0.5, take: 1.0, matsu: 2.0 };
    const defWeight = weights[level];

    for(let r=0; r<size; r++) {
        for(let c=0; c<size; c++) {
            if(board[r][c] !== 0) continue;
            
            let attack = evaluateMove(r, c, 2); 
            let defense = evaluateMove(r, c, 1);
            
            // 難易度が高いほど相手の邪魔（defense）を重視
            let total = attack + (defense * defWeight);
            
            // 梅レベルなら少しランダム性を入れる
            if(level === 'ume') total += Math.random() * 50;

            if(total > bestScore) {
                bestScore = total;
                candidates = [{r, c, attack, defense}];
            } else if(total === bestScore) {
                candidates.push({r, c, attack, defense});
            }
        }
    }
    const move = candidates[Math.floor(Math.random() * candidates.length)];
    let reason = "最善の場所を選びました。";
    if(move.attack > 5000) reason = "勝利を確信しました。";
    else if(move.defense > 5000) reason = "危ない！あなたのリーチを阻止します。";
    
    return { ...move, reason };
}

function evaluateMove(r, c, p) {
    let score = 0;
    const directions = [[1,0],[0,1],[1,1],[1,-1]];
    directions.forEach(([dr, dc]) => {
        let line = 1, openEnds = 0;
        [1, -1].forEach(s => {
            let nr = r + dr*s, nc = c + dc*s;
            while(nr>=0 && nr<size && nc>=0 && nc<size && board[nr][nc] === p) {
                line++; nr += dr*s; nc += dc*s;
            }
            if(nr>=0 && nr<size && nc>=0 && nc<size && board[nr][nc] === 0) openEnds++;
        });
        if(line >= 5) score += 100000;
        else if(line === 4) score += (openEnds === 2) ? 10000 : 1000;
        else if(line === 3) score += (openEnds === 2) ? 1000 : 100;
        else if(line === 2) score += 10;
    });
    return score;
}

function checkWin(r, c, p) {
    return [[1,0],[0,1],[1,1],[1,-1]].some(([dr, dc]) => {
        let ct = 1;
        [1, -1].forEach(s => {
            let nr = r+dr*s, nc = c+dc*s;
            while(nr>=0 && nr<size && nc>=0 && nc<size && board[nr][nc] === p) {
                ct++; nr+=dr*s; nc+=dc*s;
            }
        });
        return ct >= 5;
    });
}

function resetGame() {
    board = Array(size).fill().map(() => Array(size).fill(0));
    gameOver = false; isAiThinking = false;
    document.getElementById('log-window').innerHTML = '';
    document.getElementById('status-display').innerText = "あなたの番です";
    initBoard();
}

initBoard();
</script>
</body>
</html>
