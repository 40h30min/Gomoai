<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>五目並べ</title>
    <style>
        :root { 
            --kaya: #e3c07d; 
            --shunkei: #8b4513;
            --sakura: #ffb7c5;
        }
        body { background-color: #1a1a1a; color: #e0e0e0; font-family: "Hiragino Mincho ProN", "serif"; display: flex; flex-direction: column; align-items: center; margin: 0; overflow-x: hidden; }
        
        /* 勝率ゲージ */
        .gauge-container { width: 100%; max-width: 700px; margin: 20px 0; background: #222; padding: 15px; border: 1px solid #444; border-radius: 8px; }
        #win-rate-wrap { height: 14px; background: #333; border-radius: 7px; position: relative; overflow: hidden; border: 1px solid #555; }
        #win-rate-bar { height: 100%; width: 50%; background: linear-gradient(90deg, #b33e3e 0%, #888 50%, #3e7bb3 100%); transition: width 0.7s ease; }
        
        /* メインレイアウト */
        #main-container { display: flex; gap: 30px; padding: 30px; background: #262626; border: 1px solid #3d3d3d; border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,0.8); flex-wrap: wrap; }
        #board { display: grid; grid-template-columns: repeat(15, 38px); grid-template-rows: repeat(15, 38px); background-color: var(--kaya); padding: 5px; border: 4px solid #5d4037; position: relative; }
        .cell { width: 38px; height: 38px; border: 0.5px solid rgba(0,0,0,0.2); display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .stone { width: 34px; height: 34px; border-radius: 50%; z-index: 2; box-shadow: 2px 3px 6px rgba(0,0,0,0.6); animation: drop 0.2s ease-out; }
        @keyframes drop { from { transform: scale(1.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .black { background: radial-gradient(circle at 35% 35%, #444, #000); }
        .white { background: radial-gradient(circle at 35% 35%, #fff, #dcdcdc); border: 1px solid #bbb; }

        /* ログと操作 */
        #side-panel { width: 340px; display: flex; flex-direction: column; gap: 15px; }
        #log-window { flex-grow: 1; background: #0f0f0f; border: 1px solid #333; padding: 15px; font-size: 0.88em; overflow-y: auto; height: 380px; display: flex; flex-direction: column-reverse; }
        .btn-wa { background: var(--shunkei); color: white; border: 1px solid #bc8f8f; padding: 10px; cursor: pointer; font-family: serif; transition: 0.2s; }
        .btn-wa:hover { background: #a0522d; }
        .btn-wa:disabled { background: #444; color: #888; border-color: #333; }

        /* 勝利演出用キャンバス */
        #victory-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 100; display: none; }
        #victory-text { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 8rem; color: #d4af37; text-shadow: 0 0 30px #fff; z-index: 101; display: none; white-space: nowrap; pointer-events: none; letter-spacing: 0.5em; }
    </style>
</head>
<body>

    <h1 style="color:#d4af37; letter-spacing:0.3em;">五目並べ 零 〜祝祭〜</h1>

    <div class="gauge-container">
        <div style="display:flex; justify-content:space-between; font-size:0.9em; margin-bottom:5px;">
            <span>黒 (先手)</span><span id="rate-text">均衡</span><span>白 (後手)</span>
        </div>
        <div id="win-rate-wrap"><div id="win-rate-bar"></div></div>
    </div>

    <div id="main-container">
        <div>
            <div style="margin-bottom:15px; display:flex; gap:10px;">
                <select id="mode-select" onchange="resetGame()">
                    <option value="cpu">対機巧 (CPU戦)</option>
                    <option value="pvp">対人 (二人対局)</option>
                </select>
                <select id="level-select">
                    <option value="ume">難易度：梅</option>
                    <option value="take" selected>難易度：竹</option>
                    <option value="matsu">難易度：松</option>
                </select>
                <button class="btn-wa" onclick="undoMove()">一手戻る</button>
                <button class="btn-wa" onclick="resetGame()">清める</button>
            </div>
            <div id="board"></div>
        </div>

        <div id="side-panel">
            <div id="status-display" style="padding:15px; background:#111; text-align:center; font-size:1.2em; border-bottom:2px solid #8b4513;">いざ。</div>
            <div id="log-window"></div>
        </div>
    </div>

    <canvas id="victory-canvas"></canvas>
    <div id="victory-text">祝 勝利</div>

<script>
const size = 15;
let board = Array(size).fill().map(() => Array(size).fill(0));
let history = []; // 棋譜保存用
let gameOver = false;
let isAiThinking = false;

function initBoard() {
    const boardEl = document.getElementById('board');
    boardEl.innerHTML = '';
    for(let r=0; r<size; r++) {
        for(let c=0; c<size; c++) {
            const cell = document.createElement('div');
            cell.className = 'cell';
            cell.onclick = () => handleMove(r, c);
            boardEl.appendChild(cell);
        }
    }
}

function handleMove(r, c) {
    if(board[r][c] !== 0 || gameOver || isAiThinking) return;

    const mode = document.getElementById('mode-select').value;
    const currentPlayer = (history.length % 2 === 0) ? 1 : 2;

    // 石を置く
    executeMove(r, c, currentPlayer);

    if(!gameOver && mode === "cpu") {
        isAiThinking = true;
        document.getElementById('status-display').innerText = "思案中...";
        setTimeout(aiRoutine, 600);
    } else if(!gameOver) {
        document.getElementById('status-display').innerText = (history.length % 2 === 0 ? "黒" : "白") + "の番です";
    }
}

function executeMove(r, c, player) {
    board[r][c] = player;
    history.push({r, c, player});
    renderStones();
    
    if(checkWin(r, c, player)) {
        triggerVictory(player);
        return;
    }
    
    // 評価とログ
    const att = evaluateMove(r, c, player);
    const def = evaluateMove(r, c, player === 1 ? 2 : 1);
    updateGauge(player === 1 ? att - def : def - att);
    addLog(`(${r+1},${c+1}) ： ${att > 1000 ? '妙手なり。' : '着手。'}`, player === 1 ? "#d9534f" : "#428bca");
}

function undoMove() {
    if(history.length === 0 || gameOver) return;
    const mode = document.getElementById('mode-select').value;
    
    // CPU戦なら自分の手とCPUの手、2つ戻す
    const steps = (mode === "cpu" && history.length >= 2) ? 2 : 1;
    for(let i=0; i<steps; i++) {
        const last = history.pop();
        board[last.r][last.c] = 0;
    }
    
    renderStones();
    document.getElementById('status-display').innerText = (history.length % 2 === 0 ? "黒" : "白") + "の番";
    addLog("時を戻しました。", "#888");
}

function renderStones() {
    const cells = document.getElementsByClassName('cell');
    for(let i=0; i<cells.length; i++) cells[i].innerHTML = '';
    history.forEach(h => {
        const stone = document.createElement('div');
        stone.className = `stone ${h.player === 1 ? 'black' : 'white'}`;
        cells[h.r * size + h.c].appendChild(stone);
    });
}

function aiRoutine() {
    const level = document.getElementById('level-select').value;
    const best = getBestMove(level);
    executeMove(best.r, best.c, 2);
    if(!gameOver) {
        isAiThinking = false;
        document.getElementById('status-display').innerText = "貴殿の番";
    }
}

// --- 勝利演出 ---
function triggerVictory(player) {
    gameOver = true;
    const winner = (player === 1 ? "黒" : "白");
    document.getElementById('status-display').innerText = winner + " の勝利！";
    
    // 演出開始
    const canvas = document.getElementById('victory-canvas');
    const text = document.getElementById('victory-text');
    canvas.style.display = 'block';
    text.style.display = 'block';
    text.innerText = winner + " 勝利";

    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let particles = [];
    for(let i=0; i<100; i++) {
        particles.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            size: Math.random() * 10 + 5,
            speed: Math.random() * 3 + 1,
            angle: Math.random() * 360
        });
    }

    function animate() {
        if(!gameOver) return;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#ffb7c5"; // 桜色
        particles.forEach(p => {
            ctx.beginPath();
            ctx.ellipse(p.x, p.y, p.size, p.size/2, p.angle * Math.PI/180, 0, Math.PI*2);
            ctx.fill();
            p.y += p.speed;
            p.x += Math.sin(p.y/20);
            p.angle += 2;
            if(p.y > canvas.height) p.y = -10;
        });
        requestAnimationFrame(animate);
    }
    animate();
}

// --- AI・評価ロジック (前回の強化版を継承) ---
function getBestMove(level) {
    let bestScore = -Infinity;
    let candidates = [];
    const defWeight = (level === 'matsu' ? 3.0 : 1.5);

    for(let r=0; r<size; r++) {
        for(let c=0; c<size; c++) {
            if(board[r][c] !== 0) continue;
            let att = evaluateMove(r, c, 2);
            let def = evaluateMove(r, c, 1);
            let total = att + (def * defWeight);
            if(level === 'ume') total += Math.random() * 200;
            if(total > bestScore) { bestScore = total; candidates = [{r, c}]; }
            else if(total === bestScore) { candidates.push({r, c}); }
        }
    }
    return candidates[Math.floor(Math.random()*candidates.length)];
}

function evaluateMove(r, c, p) {
    let score = 0;
    const directions = [[1,0],[0,1],[1,1],[1,-1]];
    directions.forEach(([dr, dc]) => {
        let line = 1, open = 0;
        [1, -1].forEach(s => {
            let nr = r+dr*s, nc = c+dc*s;
            while(nr>=0 && nr<size && nc>=0 && nc<size && board[nr][nc] === p) { line++; nr+=dr*s; nc+=dc*s; }
            if(nr>=0 && nr<size && nc>=0 && nc<size && board[nr][nc] === 0) open++;
        });
        if(line >= 5) score += 100000;
        else if(line === 4) score += (open === 2) ? 10000 : 2000;
        else if(line === 3) score += (open === 2) ? 1000 : 100;
    });
    return score;
}

function checkWin(r, c, p) {
    return [[1,0],[0,1],[1,1],[1,-1]].some(([dr, dc]) => {
        let ct = 1;
        [1, -1].forEach(s => {
            let nr = r+dr*s, nc = c+dc*s;
            while(nr>=0 && nr<size && nc>=0 && nc<size && board[nr][nc] === p) { ct++; nr+=dr*s; nc+=dc*s; }
        });
        return ct >= 5;
    });
}

function updateGauge(scoreDiff) {
    let rate = 50 + (scoreDiff / 500);
    rate = Math.max(5, Math.min(95, rate));
    document.getElementById('win-rate-bar').style.width = rate + "%";
}

function addLog(msg, color) {
    const logWin = document.getElementById('log-window');
    const div = document.createElement('div');
    div.style.borderBottom = "1px solid #222";
    div.innerHTML = `<span style="color:${color}">●</span> ${msg}`;
    logWin.prepend(div);
}

function resetGame() {
    board = Array(size).fill().map(() => Array(size).fill(0));
    history = [];
    gameOver = false;
    isAiThinking = false;
    document.getElementById('victory-canvas').style.display = 'none';
    document.getElementById('victory-text').style.display = 'none';
    document.getElementById('log-window').innerHTML = '';
    document.getElementById('status-display').innerText = "いざ。";
    initBoard();
}

initBoard();
</script>
</body>
</html>
